id = "rupeji/audio-molon"
name = "Audio Molon"
version = "1.0.0"
author = "rupeji"
license = "MIT"
description = "Visualizador de espectro de audio en el escritorio impulsado por CAVA"
plugin_api = 36

[[desktop_widget]]
id = "audio-molon"
name = "Audio Molon"
entry = "desktop.luau"

[[setting]]
key = "widget_width"
type = "number"
label_key = "setting_widget_width"
default = 600
min = 120
max = 3840

[[setting]]
key = "max_height"
type = "number"
label_key = "setting_max_height"
default = 140
min = 30
max = 600

[[setting]]
key = "sensitivity"
type = "number"
label_key = "setting_sensitivity"
default = 100
min = 10
max = 500

[[setting]]
key = "color"
type = "string"
label_key = "setting_color"
default = "primary"
