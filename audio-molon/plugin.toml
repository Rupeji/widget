id = "rupeji/audio-molon"
name = "Audio Molon"
version = "1.0.0"
author = "rupeji"
license = "MIT"
description = "Visualizador de espectro de audio en el escritorio impulsado por CAVA"
plugin_api = 51

[[desktop_widget]]
id = "audio-molon"
name = "Audio Molon"
entry = "desktop.luau"

[[setting]]
key = "width"
type = "number"
label_key = "setting_width"
default = 1920
min = 200
max = 7680

[[setting]]
key = "bar_height"
type = "number"
label_key = "setting_bar_height"
default = 180
min = 30
max = 800

[[setting]]
key = "canvas_height"
type = "number"
label_key = "setting_canvas_height"
default = 600
min = 100
max = 1080

[[setting]]
key = "grow_upwards"
type = "boolean"
label_key = "setting_grow_upwards"
default = true

[[setting]]
key = "bar_width"
type = "number"
label_key = "setting_bar_width"
default = 6
min = 2
max = 40

[[setting]]
key = "bar_gap"
type = "number"
label_key = "setting_bar_gap"
default = 3
min = 1
max = 20

[[setting]]
key = "sensitivity"
type = "number"
label_key = "setting_sensitivity"
default = 100
min = 10
max = 500

[[setting]]
key = "color"
type = "string"
label_key = "setting_color"
default = "primary"

[[setting]]
key = "hide_when_idle"
type = "boolean"
label_key = "setting_hide_when_idle"
default = true
