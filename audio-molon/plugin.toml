id = "rupeji/audio-molon"
name = "Audio Molon"
version = "1.0.0"
author = "rupeji"
license = "MIT"
description = "Visualizador de espectro de audio en el escritorio impulsado por CAVA"
plugin_api = 51

[[desktop_widget]]
id = "audio-molon"
name = "Audio Molon"
entry = "desktop.luau"

[[setting]]
key = "width"
type = "number"
label_key = "setting_width"
default = 1920
min = 200
max = 3840

[[setting]]
key = "height"
type = "number"
label_key = "setting_height"
default = 140
min = 30
max = 600

[[setting]]
key = "bars"
type = "number"
label_key = "setting_bars"
default = 160
min = 8
max = 256

[[setting]]
key = "bar_gap"
type = "number"
label_key = "setting_bar_gap"
default = 2
min = 1
max = 20

[[setting]]
key = "sensitivity"
type = "number"
label_key = "setting_sensitivity"
default = 100
min = 10
max = 500

[[setting]]
key = "color"
type = "string"
label_key = "setting_color"
default = "primary"

[[setting]]
key = "hide_when_idle"
type = "boolean"
label_key = "setting_hide_when_idle"
default = true
