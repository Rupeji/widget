schema_version = 1
id = "rupeji/audio-molon"
name = "Audio Molon"
version = "0.1.0"
author = "rupeji"
license = "MIT"
icon = "activity"
description = "Visualizador de audio con CAVA para el escritorio"
plugin_api = 36

[entries.service]
script = "service.luau"
autostart = true

[entries.card]
script = "desktop.luau"

# --- Ajustes para clavar el estilo de tu foto ---
[settings.bars]
type = "int"
default = 24
min = 8
max = 64
label = "Número de barras"

[settings.bar_width]
type = "int"
default = 5
min = 2
max = 16
label = "Grosor de barra (px)"

[settings.bar_gap]
type = "int"
default = 4
min = 1
max = 12
label = "Separación entre barras (px)"

[settings.bar_radius]
type = "int"
default = 2
min = 0
max = 10
label = "Redondeo de barras (px)"

[settings.height]
type = "int"
default = 72
min = 32
max = 200
label = "Alto del widget (px)"

[settings.padding_x]
type = "int"
default = 14
min = 4
max = 40
label = "Margen horizontal (px)"

[settings.padding_y]
type = "int"
default = 10
min = 4
max = 30
label = "Margen vertical (px)"

[settings.card_radius]
type = "int"
default = 12
min = 0
max = 30
label = "Redondeo de la cápsula (px)"

[settings.gravity]
type = "int"
default = 200
min = 50
max = 500
label = "Gravedad de caída (CAVA)"

[settings.sensitivity]
type = "int"
default = 100
min = 20
max = 300
label = "Sensibilidad (%)"

[settings.monstercat]
type = "bool"
default = true
label = "Suavizado Monstercat"
