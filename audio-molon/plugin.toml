id = "rupeji/audio-molon"
name = "Audio Molon"
version = "1.0.0"
author = "rupeji"
license = "MIT"
description = "Visualizador de espectro de audio en el escritorio impulsado por CAVA"
plugin_api = 36

[[service]]
entry = "service.luau"

[[desktop_widget]]
id = "audio-molon"
name = "Audio Molon"
entry = "desktop.luau"

[[setting]]
key = "bars"
type = "number"
label_key = "setting_bars"
default = 24
min = 8
max = 64

[[setting]]
key = "bar_width"
type = "number"
label_key = "setting_bar_width"
default = 8
min = 2
max = 40

[[setting]]
key = "bar_gap"
type = "number"
label_key = "setting_bar_gap"
default = 4
min = 0
max = 24

[[setting]]
key = "max_height"
type = "number"
label_key = "setting_max_height"
default = 120
min = 30
max = 500

[[setting]]
key = "sensitivity"
type = "number"
label_key = "setting_sensitivity"
default = 100
min = 10
max = 500

[[setting]]
key = "gravity"
type = "number"
label_key = "setting_gravity"
default = 200
min = 50
max = 1000

[[setting]]
key = "monstercat"
type = "boolean"
label_key = "setting_monstercat"
default = true

[[setting]]
key = "color"
type = "string"
label_key = "setting_color"
default = "primary"
